name: Defold Extension CI

on:
  workflow_dispatch:
    inputs:
      defold_version:
        description: Defold version to validate with the checked-in pluginSpla.jar
        required: true
        default: "1.14.0"
        type: choice
        options:
          - "1.14.0"
          - "1.13.2"

env:
  DEFOLD_VERSION: ${{ inputs.defold_version }}
  BUILD_SERVER: "https://build.defold.com"
  JAVA_TOOL_OPTIONS: "--enable-native-access=ALL-UNNAMED"

jobs:
  bob-validate:
    name: Bob validate ${{ inputs.defold_version }} / ${{ matrix.platform }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform:
          - x86_64-win32
          - x86_64-linux
          - x86_64-macos
          - wasm-web
          - wasm_pthread-web
          - arm64-android
          - armv7-android
          - arm64-ios
          - arm64_sim-ios

    steps:
      - uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Download Bob
        run: |
          mkdir -p .artifacts/tools
          curl -fsSL "https://github.com/defold/defold/releases/download/${DEFOLD_VERSION}/bob.jar" -o .artifacts/tools/bob.jar

      - name: Resolve matching native SDK from Bob
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from utils.build_spriteloop_plugin import read_defold_sdk

          sdk = read_defold_sdk("java", Path(".artifacts/tools/bob.jar"), Path.cwd())
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"DEFOLD_SDK={sdk}\n")
          print(f"Validating Defold {os.environ['DEFOLD_VERSION']} with SDK {sdk}")
          PY

      - name: Bob build
        run: |
          python3 utils/validate.py \
            --bob .artifacts/tools/bob.jar \
            --platform ${{ matrix.platform }} \
            --build-server "$BUILD_SERVER" \
            --defold-sdk "$DEFOLD_SDK"
